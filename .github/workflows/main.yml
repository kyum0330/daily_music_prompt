name: Daily Music Prompt Generator

# 언제 실행할지 설정하는 부분입니다.
on:
  schedule:
    # 🌟 매 0.5시간마다(매시 정각에) 실행되도록 변경했습니다.
    - cron: '*/30 * * * *'
  
  # 원할 때 웹에서 수동으로 버튼을 눌러 바로 실행해 볼 수 있게 해주는 옵션입니다.
  workflow_dispatch:

jobs:
  generate-prompt:
    runs-on: ubuntu-latest

# 🌟 여기에 환경 변수를 추가하여 Node.js 24 버전을 강제로 사용하도록 설정합니다.
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      
    steps:
      # 1. 우겸님의 GitHub 저장소에 있는 파일들(JSON, main.py 등)을 불러옵니다.
      - name: 저장소 파일 불러오기
        uses: actions/checkout@v4

      # 2. 파이썬 환경을 세팅합니다.
      - name: Python 설치하기
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 3. 파이썬 실행에 필요한 외부 라이브러리(패키지)를 설치합니다.
      - name: 필요한 패키지 설치하기
        run: |
          python -m pip install --upgrade pip
          # 나중에 외부 API(날씨, 노션, 제미나이 등) 연동을 위해 requests 라이브러리가 필요합니다.
          pip install requests 
          pip install google-generativeai # 🌟 이 줄을 꼭 추가해 주세요!
          
      # 4. 실제 파이썬 코드를 실행합니다!
      # 실행될 때 컴퓨터의 시간대(Timezone)를 아예 서울로 맞춰버립니다. 
      # 이렇게 하면 파이썬 코드에서 별도 처리 없이도 KST 기준 오늘 날짜를 정확히 가져옵니다.
      - name: 프롬프트 생성 스크립트 실행
        env:
          TZ: 'Asia/Seoul' 
          WEATHER_API_KEY: ${{ secrets.WEATHER_API_KEY }} 
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }} 
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }} 
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }} 
        run: python main.py
