name: Daily Music Prompt Generator

# 언제 실행할지 설정하는 부분입니다.
on:
  schedule:
    # 매 2시간마다(매시 정각) 실행됩니다. (하루 12회)
    - cron: '0 */2 * * *'

  # 웹에서 수동으로 버튼을 눌러 바로 실행해 볼 수 있는 옵션입니다.
  workflow_dispatch:

jobs:
  generate-prompt:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      # 1. 저장소에 있는 파일들(JSON, main.py 등)을 불러옵니다.
      - name: 저장소 파일 불러오기
        uses: actions/checkout@v4

      # 2. 파이썬 환경을 세팅합니다.
      - name: Python 설치하기
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 3. 필요한 외부 라이브러리(패키지)를 설치합니다.
      - name: 필요한 패키지 설치하기
        run: |
          python -m pip install --upgrade pip
          pip install requests google-genai

      # 4. 실제 파이썬 코드를 실행합니다. (-u 옵션으로 로그 즉시 출력)
      - name: 프롬프트 생성 스크립트 실행
        env:
          TZ: 'Asia/Seoul'
          WEATHER_API_KEY: ${{ secrets.WEATHER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: python -u main.py
